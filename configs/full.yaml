run_name: fg_elastica_full
seed: 42
output_dir: ./outputs

data:
  train_list: /data/train.txt
  val_list: /data/val.txt
  test_list: /data/test.txt
  val_mask_list: /data/val_masks.txt
  test_mask_list: /data/test_masks.txt
  image_size: 256
  resize_short_to: 286
  batch_size: 4
  val_batch_size: 4
  test_batch_size: 4
  num_workers: 4
  hole_buckets:
    - [0.1, 0.2]
    - [0.2, 0.3]
    - [0.3, 0.45]
    - [0.45, 0.6]
  bucket_probs: [0.20, 0.20, 0.25, 0.35]
  mask_topology_modes:
    - thin_distributed
    - scattered_irregular
    - large_contiguous
    - mixed
  mask_topology_probs: [0.30, 0.30, 0.25, 0.15]

model:
  K: 5
  transformer_depth: 4
  transformer_heads: 8
  transformer_mlp_ratio: 4.0
  transformer_dropout: 0.0
  enable_p_correction: true
  enable_n_correction: true
  use_softplus_alpha: true
  use_bounded_alpha: true
  alpha_u_init: 0.10
  alpha_p_init: 0.05
  alpha_n_init: 0.05
  alpha_u_scale: 0.10
  alpha_p_scale: 0.05
  alpha_n_scale: 0.05
  use_structure_prior: true

stage_hyper:
  r1: 1.0
  r2: 2.0
  r4: 1.0
  eta: 10.0
  a: 0.1
  b: 0.2
  Tu: 5
  Tn: 5
  tau_u: 0.0625
  tau_n: 0.125
  eps: 1.0e-6

loss:
  lambda_rec: 1.0
  lambda_perc: 0.1
  lambda_edge: 1.0
  lambda_stage: 0.5
  hole_weight: 6.0
  edge_hole_only: true
  use_perceptual: false
  vgg_pretrained: false
  stage_weights: [0.05, 0.05, 0.1, 0.2, 0.3]
  lambda_p_cons: 0.01
  lambda_n_m: 0.01
  lambda_struct: 0.05

optim:
  lr: 1.0e-4
  betas: [0.9, 0.999]
  weight_decay: 1.0e-4
  epochs: 150
  warmup_steps: 5000
  min_lr_ratio: 0.05
  grad_clip: 1.0
  amp: true
  save_every: 5

eval:
  max_batches: null
  compute_lpips: true
  compute_fid: true
  fid_during_train: true

monitor:
  metric: psnr
  mode: max
  patience: 15
  min_delta: 0.01
  warmup_epochs: 10
